  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一张网页</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f5d0fe);
      color: #202124;
    }

    main {
      width: min(560px, 100%);
      padding: 40px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
    }

    h1 { font-size: 40px; }
    p { line-height: 1.8; color: #555; }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #e11d48;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
